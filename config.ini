; ====================================================================
; Configuracion Spirax - Torno Fanuc
;
; Estos valores se cargan al iniciar la HMI. Si querés cambiar la IP
; del torno, los numeros de macro, etc, edita este archivo.
;
; NOTA: por ahora estos defaults se aplican desde spirax_torno.py
; directamente. Si quieren leerlo dinamicamente, usar configparser
; en spirax_hmi al instanciar el TornoFanuc.
; ====================================================================

[torno]
host = 192.168.1.10
port = 8193
timeout_focas = 10
dll_path = ./dlls

[macros]
; #551 = NUMERO DE PIEZA (1-12, 0 = sin pieza)  -> 1-6 aluminio, 7-12 fundicion
; #550 = OPERACION A MECANIZAR (10 o 20, 0 = sin pieza)
; #552 = TIPO DE ROSCA (1, 2 o 3, 0 = sin rosca)
; #553 = FLAG fin de mecanizado (torno escribe 1, PC limpia a 0)
; NOTA: nro de pieza (1-12) y rosca solo se mandan al torno; el robot sigue igual.
tipo  = 551
op    = 550
rosca = 552
fin   = 553

[sync]
; Intervalo de polling de #553 en milisegundos
polling_ms = 500
; Archivo donde se persiste la cola
persist_path = cola_torno.json
